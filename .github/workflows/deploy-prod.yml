name: Deploy to PRODUCTION

on:
  push:
    branches: [ main ]

env:
  GCP_PROJECT_ID: retailhub-services
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - id: decode
      run: echo "GCP_KEY=$(echo '${{ secrets.GCP_SA_KEY }}' | base64 -d)" >> $GITHUB_OUTPUT
    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ steps.decode.outputs.GCP_KEY }}
    - uses: google-github-actions/setup-gcloud@v2
    - run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}
    - run: |
        for service in order payment loyalty user product; do
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/retailhub/$service:prod-${{ github.sha }} $service-service/
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/retailhub/$service:prod-${{ github.sha }}
        done
