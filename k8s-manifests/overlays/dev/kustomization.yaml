apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base/

images:
  - name: order-service
    newName: us-central1-docker.pkg.dev/retailhub-services/retailhub/order-service
    newTag: dev
  - name: payment-service
    newName: us-central1-docker.pkg.dev/retailhub-services/retailhub/payment-service
    newTag: dev
  - name: product-service
    newName: us-central1-docker.pkg.dev/retailhub-services/retailhub/product-service
    newTag: dev
  - name: user-service
    newName: us-central1-docker.pkg.dev/retailhub-services/retailhub/user-service
    newTag: dev
  - name: loyalty-service
    newName: us-central1-docker.pkg.dev/retailhub-services/retailhub/loyalty-service
    newTag: dev

patchesJson6902:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: order-service
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: gcr-json-key
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: payment-service
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: gcr-json-key
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: product-service
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: gcr-json-key
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: user-service
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: gcr-json-key
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: loyalty-service
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
        - name: gcr-json-key
