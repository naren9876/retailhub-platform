name: Deploy to DEV
on:
  push:
    branches: [ develop ]
env:
  GCP_PROJECT_ID: retailhub-services
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  ENVIRONMENT: dev
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
    - run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}
    - run: |
        for service in order payment loyalty user product; do
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/retailhub/$service:dev-${{ github.sha }} $service-service/
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/retailhub/$service:dev-${{ github.sha }}
        done
