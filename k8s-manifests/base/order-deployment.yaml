apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    service: order
spec:
  replicas: 1  # Will be overridden by overlays
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        service: order
    spec:
      containers:
      - name: order
        image: us-central1-docker.pkg.dev/retailhub-services/retailhub/order@sha256:2e0704e540639373929071011e7219a9719c8489f290700a5faebd5687329ee9
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5003
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        envFrom:
        - configMapRef:
            name: order-config
        livenessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
    service: order
spec:
  selector:
    app: order-service
  ports:
  - port: 5003
    targetPort: 5003
    name: http
  type: ClusterIP
