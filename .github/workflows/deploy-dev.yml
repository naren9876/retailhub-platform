name: Deploy RetailHub Dev

on:
  push:
    branches: [ develop ]

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: retailhub-services
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/427578819714/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_SERVICE_ACCOUNT: github-actions@retailhub-services.iam.gserviceaccount.com
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  ENVIRONMENT: dev
  CLUSTER_NAME: retailhub-dev-cluster
  CLUSTER_ZONE: us-central1-a

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - id: auth
      name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
    
    - name: Get GKE Credentials
      run: |
        gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
          --zone=${{ env.CLUSTER_ZONE }} \
          --project=${{ env.GCP_PROJECT_ID }}
    
    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}
    
    - name: Build and Push Images (AMD64)
      run: |
        for service in order payment product user loyalty; do
          echo "Building ${service}-service for linux/amd64..."
          docker build --platform linux/amd64 \
            -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/retailhub/${service}-service:dev \
            ./${service}-service/
          
          echo "Pushing ${service}-service..."
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/retailhub/${service}-service:dev
          
          echo "✅ ${service}-service pushed"
        done
    
    - name: Create Namespace and Service Accounts
      run: |
        kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
        kubectl label namespace dev name=dev --overwrite
        
        for service in order payment product user loyalty; do
          kubectl create serviceaccount ${service}-service -n dev --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl annotate serviceaccount ${service}-service -n dev \
            iam.gke.io/gcp-service-account=retailhub-k8s-workload@retailhub-services.iam.gserviceaccount.com \
            --overwrite
        done
        
        echo "✅ Namespace and service accounts ready"
    
    - name: Apply Kubernetes Manifests
      run: |
        kubectl apply -k k8s-manifests/overlays/dev/ --validate=false
        echo "✅ Manifests applied"
    
    - name: Restart Deployments
      run: |
        kubectl rollout restart deployment -n dev
        echo "✅ Deployments restarted"
    
    - name: Verify Rollout
      run: |
        kubectl rollout status deployment -n dev --timeout=5m
        echo "✅ All deployments rolled out successfully"
    
    - name: Verify Pod Health
      run: |
        kubectl get pods -n dev
        kubectl get deployments -n dev
        echo "✅ All pods verified"

