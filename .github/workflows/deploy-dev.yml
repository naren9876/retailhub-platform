name: Deploy to DEV

on:
  push:
    branches: [ develop ]

env:
  GCP_PROJECT: retailhub-services
  REGISTRY: us-central1-docker.pkg.dev
  CLUSTER: retailhub-dev-cluster
  ZONE: us-central1-a
  NAMESPACE: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - uses: google-github-actions/setup-gcloud@v2
    
    - name: Install gke-gcloud-auth-plugin
      run: gcloud components install gke-gcloud-auth-plugin
    
    - run: gcloud auth configure-docker ${{ env.REGISTRY }}
    
    - name: Build and push Docker images (DEV)
      run: |
        COMMIT_SHA=$(git rev-parse --short HEAD)
        for service in order payment loyalty user product; do
          docker build -t ${{ env.REGISTRY }}/${{ env.GCP_PROJECT }}/retailhub/$service:dev-${COMMIT_SHA} $service-service/
          docker push ${{ env.REGISTRY }}/${{ env.GCP_PROJECT }}/retailhub/$service:dev-${COMMIT_SHA}
        done
    
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ env.CLUSTER }} \
          --zone=${{ env.ZONE }} --project=${{ env.GCP_PROJECT }}
    
    - name: Install Kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/
    
    - name: Deploy to DEV with Kustomize
      run: kubectl apply -k k8s-manifests/overlays/dev/ --validate=false
    
    - name: Verify rollout
      run: kubectl rollout status deployment -n ${{ env.NAMESPACE }} --timeout=300s
    
    - name: Check pods
      run: kubectl get pods -n ${{ env.NAMESPACE }}
